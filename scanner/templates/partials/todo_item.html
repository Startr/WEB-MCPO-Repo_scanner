{#- One inline TODO comment card. Included standalone (scan stream) and from todos_list.html. -#}
<div class="todo-item" id="todo-{{ tid }}" style="--bgc:#f9f9f9; --p:15px; --mb:15px; --radius:5px; --bl:4px solid #4CAF50; --shadow:6">
    <div class="file-path" style="--weight:bold; --c:#333; --mb:5px">{{ todo.file_path }}<a
            data-editor-link="1" data-file-path="{{ todo.file_path }}" data-line-num="{{ todo.line_num }}"
            target="_blank" rel="noopener noreferrer"
            style="--c:#0066cc; --td:none; --fs:0.8em; --ml:10px; --weight:normal; display:none">Open in editor</a></div>
    <div class="line-num" style="--c:#666; --size:0.9em">Line {{ todo.line_num }}{% if author %}<span class="card-author" title="{{ author.date }}" style="font-size:0.85em; color:#888; font-style:italic"> — {{ author.author }}</span>{% endif %}</div>
    <div class="todo-text" style="--bgc:#fff; --p:10px; --radius:3px; --b:1px solid #ddd; --shadow:4; --m:10px 0; --ff:monospace; --ws:pre-wrap">{{ highlighted }}</div>
    {% if todo.next_line %}
    <div class="next-line" style="--bgc:#f5f5f5; --p:10px; --radius:3px; --b:1px solid #ddd; --shadow:4; --ff:monospace; --ws:pre-wrap">{{ todo.next_line }}</div>
    {% endif %}
</div>
